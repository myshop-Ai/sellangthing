function readForm(){var g=function(i){var e=$('#'+i);return e?e.value:''};F.name=g('fName').trim();F.phone=g('fPhone').trim();F.province=g('fProv');F.address=g('fAddr').trim();F.note=g('fNote').trim();save()}
function checkCoupon(silent){
  var code=V.coupon.trim();if(!code){V.cdisc=0;V.cmsg='';return Promise.resolve()}
  var sub=calc().sub;
  return SB.rpc('check_coupon',{p_code:code,p_subtotal:sub}).then(function(r){
    if(r.ok){V.cdisc=r.discount;V.cmsg='ໃຊ້ຄູປອງ '+r.code+' ແລ້ວ ຫຼຸດ '+money(r.discount)}else{V.cdisc=0;if(!silent)V.cmsg=r.msg;else V.cmsg=r.msg}
    if($('#cartm'))cartView()
  }).catch(function(e){V.cdisc=0;V.cmsg=e.message;if($('#cartm'))cartView()})
}
function place(){
  readForm();var c=calc(),er=$('#cerr');
  var bad=!F.name?'ກະລຸນາໃສ່ຊື່':(F.phone.replace(/\D/g,'').length<8?'ກະລຸນາໃສ່ເບີໂທໃຫ້ຖືກຕ້ອງ':!F.province?'ກະລຸນາເລືອກແຂວງ':'');
  if(bad){er.innerHTML='<div class="err" style="margin-top:10px">'+bad+'</div>';return}
  V.busy=true;cartView();
  SB.rpc('place_order',{p:{name:F.name,phone:F.phone,address:F.address,province:F.province,note:F.note,pay:V.pay,coupon:V.cdisc?V.coupon:'',items:c.L.map(function(l){return{id:l.p.id,v:l.v,qty:l.q}})}}).then(function(r){
    TOK.unshift(r.token);TOK=TOK.slice(0,40);lsSet('shop_tokens',TOK);
    var lines=c.L.map(function(l){return{name:lineName(l.p,l.v),qty:l.q,price:eff(l.p)}});
    CART={};save();V.busy=false;V.coupon='';V.cdisc=0;V.cmsg='';updCart();
    var ov=$('#cartov');if(ov)ov.remove();success(r,lines,V.pay);reload()
  }).catch(function(e){V.busy=false;cartView();$('#cerr').innerHTML='<div class="err" style="margin-top:10px">'+esc(e.message)+'</div>'})
}
function slipLink(no,total){
  var num=String(ST.wa||'').replace(/\D/g,'');if(num.length<8)return'';
  return'https://wa.me/'+num+'?text='+encodeURIComponent('ສະບາຍດີ, ຂ້ອຍໂອນເງິນແລ້ວ ເລກອໍເດີ '+no+' ຍອດ '+money(total)+' (ແນບສະລິບ)')
}
function banksOf(){
  if(Array.isArray(ST.banks)&&ST.banks.length){var b=ST.banks.filter(function(x){return x&&(x.qr||x.info||x.name)});if(b.length)return b}
  return(ST.qr||ST.pay)?[{name:'',info:ST.pay||'',qr:ST.qr||''}]:[]
}
function qrBox(total){
  var B=banksOf(),t=total==null?'':total;
  if(!B.length)return'<div class="hint" style="margin-top:8px">ຮ້ານຈະສົ່ງເລກບັນຊີໃຫ້ທາງ WhatsApp ຫຼັງຮັບອໍເດີ</div>';
  var k=Math.min(V.bank||0,B.length-1),b=B[k];
  return'<div class="qrwrap" data-t="'+esc(t)+'">'+(B.length>1?'<div class="sm muted" style="margin-top:10px">ເລືອກທະນາຄານທີ່ຕ້ອງການໂອນ</div><div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:6px">'+B.map(function(x,i){return'<button type="button" class="chip" data-bank="'+i+'" aria-pressed="'+(i===k)+'">'+esc(x.name||('ບັນຊີ '+(i+1)))+'</button>'}).join('')+'</div>':'')+
  '<div class="qrbox">'+(total!=null?'<div>ໂອນຍອດ <b>'+money(total)+'</b></div>':'<div class="sm muted">ສະແກນ QR ເພື່ອໂອນ (ໂອນຕາມຍອດລວມທີ່ສະແດງ)</div>')+
    (B.length===1&&b.name?'<div><b>'+esc(b.name)+'</b></div>':'')+
    (b.qr?'<img src="'+esc(b.qr)+'" alt="QR ໂອນເງິນ '+esc(b.name)+'"><a class="btn sm" download="qr-'+esc((b.name||'transfer').replace(/[^\w\u0E80-\u0EFF-]+/g,'_'))+'.png" href="'+esc(b.qr)+'">⬇ ບັນທຶກຮູບ QR</a>':'')+
    (b.info?'<div class="pre">'+esc(b.info)+'</div>':'')+'</div></div>'
}
function waLink(r,lines){
  var num=String(ST.wa||'').replace(/\D/g,'');if(num.length<8)return'';
  var t='ສະບາຍດີ, ຂ້ອຍສັ່ງຊື້ ເລກອໍເດີ '+r.no+'\n'+lines.map(function(l){return'• '+l.name+' × '+l.qty}).join('\n')+'\nລວມ '+money(r.total)+'\nຊື່: '+F.name+'\nໂທ: '+F.phone+'\nແຂວງ: '+F.province+(F.address?'\nທີ່ຢູ່: '+F.address:'');
  return'https://wa.me/'+num+'?text='+encodeURIComponent(t)
}

function resizeJpg(file,max,q){return new Promise(function(res,rej){var r=new FileReader();r.onerror=function(){rej(new Error('ອ່ານຮູບບໍ່ໄດ້'))};r.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('ໄຟລ໌ນີ້ບໍ່ແມ່ນຮູບ ຫຼືເປີດບໍ່ໄດ້'))};im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function slipHtml(tok,at){
  var inp='<input type="file" accept="image/*" data-slip="'+esc(tok)+'" hidden>';
  return'<div class="slipbox" data-tok="'+esc(tok)+'">'+(at?'<div class="okbox">🧾 ສົ່ງສະລິບແລ້ວ · '+fmtDate(at)+'<br><span class="sm">ຮ້ານກຳລັງກວດສອບ ແລະຈະຢືນຢັນໃຫ້</span></div><label class="btn sm slipbtn">ສົ່ງສະລິບໃໝ່'+inp+'</label>':'<label class="btn primary big slipbtn">📎 ອັບໂຫຼດສະລິບໂອນເງິນ'+inp+'</label><div class="sm muted" style="text-align:center">ຖ່າຍຮູບ ຫຼືເລືອກຮູບສະລິບຈາກເຄື່ອງ</div>')+'</div>'}
document.addEventListener('change',function(e){
  var t=e.target;if(!t||!t.hasAttribute||!t.hasAttribute('data-slip'))return;
  var f=t.files&&t.files[0],tok=t.dataset.slip,box=t.closest('.slipbox');if(!f)return;
  if(f.type&&!/^image\//.test(f.type)){toast('ກະລຸນາເລືອກໄຟລ໌ຮູບ',true);t.value='';return}
  if(box)box.classList.add('busy');
  resizeJpg(f,1100,.82).then(function(u){return u.length>600000?resizeJpg(f,800,.68):u}).then(function(u){return SB.rpc('submit_slip',{p_token:tok,p_img:u})}).then(function(r){
    var at=(r&&r.slip_at)||new Date().toISOString();
    document.querySelectorAll('.slipbox').forEach(function(b){if(b.dataset.tok===tok)b.outerHTML=slipHtml(tok,at)});
    (V.orders||[]).forEach(function(o){if(o.token===tok)o.slip_at=at});
    toast('ສົ່ງສະລິບແລ້ວ ✓')
  }).catch(function(err){
    if(box)box.classList.remove('busy');t.value='';
    var m=err&&err.message||'';if(/submit_slip|schema cache|Could not find/i.test(m))m='ລະບົບຍັງບໍ່ພ້ອມຮັບສະລິບ — ກະລຸນາສົ່ງສະລິບທາງ WhatsApp';
    toast(m||'ສົ່ງສະລິບບໍ່ສຳເລັດ',true)})
});

    (o.tracking||o.carrier?'<div class="okbox">🚚 '+esc(o.carrier)+' '+esc(o.tracking)+'</div>':'')+
    '<div class="tot g"><span>ລວມ</span><span>'+money(o.total)+'</span></div>'+
    (o.pay==='transfer'&&!o.paid&&o.status!=='cancelled'?'<button class="btn primary sm" data-qr="'+esc(o.no)+'">ເບິ່ງ QR ໂອນເງິນ</button>'+('slip_at' in o?slipHtml(o.token,o.slip_at):''):'')+(o.status==='new'?'<button class="btn danger sm" data-cancel="'+esc(o.token)+'">ຍົກເລີກອໍເດີ</button>':'')+'</div>'}).join('')+'</div>';
  if(V.loadErr2)h+='<div class="err" style="margin-top:10px">'+esc(V.loadErr2)+'</div>';
  app.innerHTML=h
}
// ---- product detail / share ----
var PV={id:'',v:'',i:0},PIMG={};
function prodUrl(id){var b=location.href.split('#')[0].split('?')[0];return b+'?p='+encodeURIComponent(id)}
function copyText(t){function fb(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('ຄັດລອກລິ້ງແລ້ວ')}catch(e){toast('ຄັດລອກບໍ່ໄດ້ — ກົດຄ້າງທີ່ລິ້ງໃນແຖບທີ່ຢູ່',true)}a.remove()}
  try{navigator.clipboard.writeText(t).then(function(){toast('ຄັດລອກລິ້ງແລ້ວ')},fb)}catch(e){fb()}}
function openProduct(id){
  var p=byId[id];if(!p){toast('ບໍ່ພົບສິນຄ້ານີ້ (ອາດປິດຂາຍແລ້ວ)',true);return}
  PV={id:id,v:'',i:0};
  var ex=$('#pdov');if(ex)ex.remove();
  var o=modal('<div id="pdm"></div>','wide');o.id='pdov';prodView();
  if(PIMG[id]===undefined){PIMG[id]=null;SB.select('product_images','select=img&product_id=eq.'+id+'&order=pos.asc').then(function(r){PIMG[id]=(r||[]).map(function(x){return x.img});if($('#pdm')&&PV.id===id)prodView()}).catch(function(){PIMG[id]=[]})}
}
function prodView(){
  var el=$('#pdm');if(!el)return;var p=byId[PV.id];if(!p){var ov=el.closest('.ov');if(ov)ov.remove();return}
  var imgs=[];if(p.img)imgs.push(p.img);(PIMG[p.id]||[]).forEach(function(x){imgs.push(x)});
  if(PV.i>=imgs.length)PV.i=0;
  var sale=p.sale>0&&p.sale<p.price,hv=hasV(p),lab=p.opt_label||'ຕົວເລືອກ';
  var st=hv?(PV.v?stockOf(p,PV.v):null):p.stock,key=kOf(p.id,PV.v),inCart=CART[key]||0,n=calc().n;
  var h='<div class="mh"><h2>'+esc(p.name)+'</h2><button class="x" data-close aria-label="ປິດ">×</button></div>';
  h+='<div class="gal"><div class="big">'+(imgs.length?'<img alt="'+esc(p.name)+'" src="'+esc(imgs[PV.i])+'">':'<span>'+esc((p.name||'?').charAt(0))+'</span>')+'</div>';
  if(imgs.length>1)h+='<div class="thumbs">'+imgs.map(function(s,i){return'<button class="th'+(i===PV.i?' on':'')+'" data-pi="'+i+'" aria-label="ຮູບທີ '+(i+1)+'"><img alt="" src="'+esc(s)+'"></button>'}).join('')+'</div>';
  h+='</div>';
  h+='<div class="pr" style="margin:12px 0 4px"><b style="font-size:22px">'+money(eff(p))+'</b>'+(sale?'<s>'+money(p.price)+'</s><span class="badge b-hot">-'+Math.round((1-p.sale/p.price)*100)+'%</span>':'')+'</div>';
  if(p.category)h+='<div class="sm muted">'+esc(p.category)+'</div>';
  if(p.descr)h+='<p style="margin:8px 0;white-space:pre-wrap">'+esc(p.descr)+'</p>';
  if(hv)h+='<div style="margin:10px 0 6px;font-weight:600">'+esc(lab)+(PV.v?'':' <span class="sm muted">(ກະລຸນາເລືອກ)</span>')+'</div><div class="chips" style="flex-wrap:wrap;overflow:visible">'+p.variants.map(function(x){var s=Math.max(0,Number(x.stock)||0);return'<button class="chip" data-pv="'+esc(x.name)+'" aria-pressed="'+(PV.v===x.name)+'"'+(s<=0?' disabled':'')+'>'+esc(x.name)+(s<=0?' (ໝົດ)':'')+'</button>'}).join('')+'</div>';
  if(st!=null&&st>0&&st<=(p.low||5))h+='<div class="sm" style="color:var(--warn);margin-top:6px">ເຫຼືອ '+st+' ອັນ</div>';
  h+='<div class="col" style="margin-top:12px">';
  if(p.stock<=0)h+='<button class="btn big" disabled>ສິນຄ້າໝົດ</button>';
  else if(hv&&!PV.v)h+='<button class="btn big" disabled>ເລືອກ'+esc(lab)+'ກ່ອນ</button>';
  else if(inCart)h+='<div class="qty" style="min-height:48px"><button data-dec="'+esc(key)+'" aria-label="ຫຼຸດ">−</button><b>'+inCart+' ໃນກະຕ່າ</b><button data-inc="'+esc(key)+'" aria-label="ເພີ່ມ">+</button></div>';
  else h+='<button class="btn primary big" data-add="'+esc(key)+'">+ ໃສ່ກະຕ່າ</button>';
  if(n)h+='<button class="btn big" id="pdCart">🛒 ເບິ່ງກະຕ່າ ('+n+')</button>';
  h+='</div>';
  var url=prodUrl(p.id),msg=p.name+' — '+money(eff(p));
  if(waNum().length>=8)h+='<a class="btn wa" style="margin-top:12px;width:100%" target="_blank" rel="noopener" href="'+esc(chatHref(p))+'">💬 ຖາມຮ້ານກ່ຽວກັບສິນຄ້ານີ້</a>';
  h+='<div class="row" style="flex-wrap:wrap;margin-top:14px;gap:8px"><span class="sm muted">ແຊຣ໌ສິນຄ້ານີ້:</span>'+(navigator.share?'<button class="btn sm" data-share="1">📤 ແຊຣ໌</button>':'')+'<button class="btn sm" data-copy="1">🔗 ຄັດລອກລິ້ງ</button><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(msg+'\n'+url)+'">WhatsApp</a><a class="btn sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)+'">Facebook</a></div>';
  var sc=el.closest('.md')?el.closest('.md').scrollTop:0;
  el.innerHTML=h;if(el.closest('.md'))el.closest('.md').scrollTop=sc
}
function openLinked(){
  if(V.linkDone)return;V.linkDone=true;
  var pp=null;try{pp=new URLSearchParams(location.search).get('p')}catch(e){}
  if(!pp)return;
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  if(byId[pp]){openProduct(pp);return}
  if(!/^[0-9a-fA-F-]{36}$/.test(pp)){openProduct(pp);return}
  SB.select('products','select=*&active=eq.true&id=eq.'+pp).then(function(r){if(r&&r[0])addP(r[0]);openProduct(pp)}).catch(function(){openProduct(pp)})
}
// ---- lookup order by number + phone ----
function lookup(){
  var no=(V.lkNo||'').trim(),ph=(V.lkPhone||'').trim(),er=$('#lkErr'),b=$('#lkGo');
  if(!no||ph.replace(/\D/g,'').length<8){er.innerHTML='<div class="err">ກະລຸນາໃສ່ເລກອໍເດີ ແລະ ເບີໂທໃຫ້ຄົບ</div>';return}
  b.disabled=true;b.textContent='ກຳລັງຄົ້ນຫາ…';er.innerHTML='';
  SB.rpc('lookup_order',{p_no:no,p_phone:ph}).then(function(r){
    if(!r){b.disabled=false;b.textContent='ຄົ້ນຫາ';er.innerHTML='<div class="err">ບໍ່ພົບອໍເດີ — ກວດເລກອໍເດີ ແລະ ເບີໂທທີ່ໃຊ້ສັ່ງອີກຄັ້ງ</div>';return}
    if(TOK.indexOf(r.token)<0){TOK.unshift(r.token);TOK=TOK.slice(0,40);lsSet('shop_tokens',TOK)}
    V.lkNo='';V.lkPhone='';V.lkOpen=false;V.orders=null;renderOrders();loadOrders();toast('ພົບອໍເດີ '+r.no+' ແລ້ວ')
  }).catch(function(e){b.disabled=false;b.textContent='ຄົ້ນຫາ';er.innerHTML='<div class="err">'+esc(e.message)+'</div>'})
}
// ---- events ----
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-add],[data-inc],[data-dec],[data-tab],[data-cat],[data-rm],[data-fcat],[data-close],[data-cancel],[data-qr],[data-bank],[data-view],[data-pv],[data-pi],[data-share],[data-copy],#pdCart,#lkGo,#bMenu,#bMore,#more,#fApply,#fClear,#bCart,#bOrders,#back,#bPlace,#bCoupon,#goOrders');if(!t)return;
  if(t.hasAttribute('data-bank')){V.bank=Number(t.dataset.bank)||0;document.querySelectorAll('.qrwrap').forEach(function(w){var tt=w.dataset.t;w.outerHTML=qrBox(tt===''?null:Number(tt))});return}
  if(t.hasAttribute('data-view')){openProduct(t.dataset.view);return}
  if(t.hasAttribute('data-pv')){PV.v=(PV.v===t.dataset.pv?'':t.dataset.pv);prodView();return}
  if(t.hasAttribute('data-pi')){PV.i=Number(t.dataset.pi)||0;prodView();return}
  if(t.hasAttribute('data-copy')){copyText(prodUrl(PV.id));return}
  if(t.hasAttribute('data-share')){var sp=byId[PV.id];if(sp&&navigator.share)navigator.share({title:sp.name,text:sp.name+' — '+money(eff(sp)),url:prodUrl(sp.id)}).catch(function(){});return}
  if(t.id==='pdCart'){var pv=$('#pdov');if(pv)pv.remove();openCart();return}
  if(t.id==='lkGo'){lookup();return}
  if(t.id==='bMenu'||t.id==='bMore'){openFilter();return}
  if(t.id==='more'){t.disabled=true;fetchList(false);return}
  if(t.id==='fApply'){applyFilter();return}
  if(t.id==='fClear'){D.cat='';D.cf='';var fc=$('#fcats');if(fc)fc.innerHTML=fcatsHtml();['fmin','fmax','fcf'].forEach(function(i){var e=$('#'+i);if(e)e.value=''});var fs=$('#fstock');if(fs)fs.checked=false;return}
  if(t.hasAttribute('data-fcat')){D.cat=t.dataset.fcat;var fc2=$('#fcats');if(fc2)fc2.innerHTML=fcatsHtml();return}
  if(t.hasAttribute('data-rm')){clearFilter(t.dataset.rm);return}
  if(t.dataset.add)setQ(t.dataset.add,1);
  else if(t.dataset.inc)setQ(t.dataset.inc,(CART[t.dataset.inc]||0)+1);
  else if(t.dataset.dec)setQ(t.dataset.dec,(CART[t.dataset.dec]||0)-1);
  else if(t.dataset.tab!=null&&t.hasAttribute('data-tab')){V.tab=t.dataset.tab;fetchList(true)}
  else if(t.hasAttribute('data-cat')){V.cat=t.dataset.cat;fetchList(true)}
  else if(t.hasAttribute('data-close')){var o=t.closest('.ov');if(o)o.remove()}
  else if(t.dataset.qr){var oo=(V.orders||[]).find(function(x){return x.no===t.dataset.qr});if(oo){var sl2=slipLink(oo.no,oo.total);modal('<div class="mh"><h2>ໂອນເງິນ '+esc(oo.no)+'</h2><button class="x" data-close aria-label="ປິດ">×</button></div>'+qrBox(oo.total)+('slip_at' in oo?slipHtml(oo.token,oo.slip_at):'')+(sl2?'<a class="btn wa big" style="margin-top:12px" target="_blank" rel="noopener" href="'+esc(sl2)+'">ສົ່ງສະລິບໂອນທາງ WhatsApp</a>':''))}}
  else if(t.dataset.cancel){
    if(!t.classList.contains('sure')){t.classList.add('sure');t.textContent='ກົດອີກຄັ້ງເພື່ອຢືນຢັນຍົກເລີກ';return}
    t.disabled=true;SB.rpc('cancel_order',{p_token:t.dataset.cancel}).then(function(ok){toast(ok?'ຍົກເລີກແລ້ວ':'ຍົກເລີກບໍ່ໄດ້ ຮ້ານຢືນຢັນອໍເດີແລ້ວ',!ok);loadOrders()}).catch(function(er){toast(er.message,true);t.disabled=false})}
  else if(t.id==='bCart')openCart();
  else if(t.id==='bOrders'||t.id==='goOrders'){document.querySelectorAll('.ov').forEach(function(o){o.remove()});V.view='orders';V.orders=null;render();loadOrders();window.scrollTo(0,0)}
  else if(t.id==='back'){V.view='shop';render()}
  else if(t.id==='bPlace')place();
  else if(t.id==='bCoupon'){V.coupon=($('#fCoupon').value||'').trim();readForm();checkCoupon(false)}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='q'){clearTimeout(V.qt);V.view='shop';fetchList(true);e.target.blur();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.im[data-view]')){e.preventDefault();openProduct(e.target.dataset.view)}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){V.q=t.value;if(V.view!=='shop'){V.view='shop';render()}clearTimeout(V.qt);V.qt=setTimeout(function(){fetchList(true)},300)}
  else if(t.id==='fcf'){D.cf=t.value;var fc3=$('#fcats');if(fc3)fc3.innerHTML=fcatsHtml()}
  else if(t.id==='fCoupon'){V.coupon=t.value.trim();V.cdisc=0;V.cmsg=''}
  else if(t.id==='lkNo'){V.lkNo=t.value;V.lkOpen=true}
  else if(t.id==='lkPhone'){V.lkPhone=t.value;V.lkOpen=true}
  else if(['fName','fPhone','fAddr','fNote'].indexOf(t.id)>=0)readForm();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sort'){V.sort=t.value;fetchList(true)}
  else if(t.id==='fProv'){readForm();cartView()}
  else if(t.name==='pay'){readForm();V.pay=t.value;cartView()}
});
setInterval(function(){var a=document.activeElement;if(V.view==='orders'&&!document.querySelector('.ov')&&TOK.length&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))loadOrders()},30000);
init();
})();
</script>
