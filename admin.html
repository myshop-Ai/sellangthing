   '<div class="card"><b>ສິນຄ້າຂາຍດີ 30 ວັນ</b>'+(top.length?top.map(function(t,i){return'<div class="tot"><span>'+(i+1)+'. '+esc(t[0])+'</span><b>'+t[1]+'</b></div>'}).join(''):'<div class="muted" style="padding:12px 0">ຍັງບໍ່ມີຂໍ້ມູນ</div>')+'</div></div>';

function editOrderModal(id){
  var o=ORD.find(function(x){return x.id===id});if(!o)return;
  var canItems=o.status==='new'||o.status==='confirmed';
  var L=(o.items||[]).map(function(i){return{id:i.id||'',v:i.v||'',name:i.name,price:Number(i.price)||0,qty:Number(i.qty)||1}}),orig=JSON.stringify(L);
  var F={name:o.name,phone:o.phone,province:o.province,address:o.address||'',note:o.note||'',pay:o.pay,ship:Number(o.ship)||0,discount:Number(o.discount)||0};
  var m=modal('<div id="em"></div>','wide');
  function sub(){return L.reduce(function(s,l){return s+l.price*l.qty},0)}
  function total(){var s=sub(),d=Math.min(Math.max(Number(F.discount)||0,0),s);return s-d+Math.max(Number(F.ship)||0,0)}
  function rd(){var g=function(i){var e=$('#'+i,m);return e?e.value:null};var v;
    if((v=g('e1'))!=null)F.name=v.trim();if((v=g('e2'))!=null)F.phone=v.trim();if((v=g('e3'))!=null)F.province=v;if((v=g('e4'))!=null)F.pay=v;if((v=g('e5'))!=null)F.address=v;if((v=g('e6'))!=null)F.note=v;if((v=g('e7'))!=null)F.ship=Math.max(0,Number(v)||0);if((v=g('e8'))!=null)F.discount=Math.max(0,Number(v)||0)}

var SAMPLE=['ນ້ຳດື່ມ 600ml','ກາເຟເຢັນກະປ໋ອງ','ເບຍລາວ ກະປ໋ອງ','ໂຄ໊ກ 1.5 ລິດ','ເຂົ້າໜຽວ 1 ກິໂລ','ໄຂ່ໄກ່ ແຜງ 30 ໜ່ວຍ','ໝີ່ສຳເລັດຮູບ','ນ້ຳປາ ຕຸກ 700ml','ສະບູກ້ອນ','ຜ້າເຊັດໂຕ','ຖ່ານໄຟສາຍ AA (ແພັກ 4)','ສາຍສາກ USB-C'];
var GOLIVE_MANUAL=[['pw','ປ່ຽນບັນຊີແອັດມິນເປັນອີເມວຈິງຂອງທ່ານ + ລະຫັດຢ່າງໜ້ອຍ 12 ຕົວ'],['signup','ປິດ “Allow new users to sign up” ໃນ Supabase (Authentication → Sign In / Providers)'],['mobile','ເປີດລິ້ງຮ້ານຈາກມືຖືເຄື່ອງອື່ນ ແລະ ສັ່ງຊື້ທົດລອງໄດ້ ແລ້ວແອັດມິນເຫັນອໍເດີ'],['print','ທົດລອງພິມບິນ 1 ໃບ (ເປັນ PDF ກໍໄດ້) ກວດວ່າຂໍ້ຄວາມລາວອ່ານໄດ້'],['backup','ກົດ “ດາວໂຫຼດ Excel” ໃນແທັບລາຍງານ ເກັບເປັນສຳຮອງ (ເຮັດທຸກອາທິດ)'],['share','ມີລິ້ງຮ້ານພ້ອມສົ່ງລູກຄ້າ (ໃສ່ໃນ Facebook/WhatsApp/ບັນຊີຮ້ານ)']];
function goLiveItems(){return[
  ['ໃສ່ເບີ WhatsApp ຂອງຮ້ານ',String(ST.wa||'').length>=8,'set'],
  ['ໃສ່ຂໍ້ມູນໂອນເງິນ ຫຼື ອັບໂຫຼດ QR',!!(ST.qr||ST.pay),'set'],
  ['ຕັ້ງຄ່າຈັດສົ່ງ (ຄ່າມາດຕະຖານ ຫຼື ຕາມແຂວງ)',Number(ST.def)>0||Object.keys(ST.fees||{}).length>0,'set'],
  ['ໃສ່ທີ່ຢູ່/ເບີໂທຮ້ານສຳລັບພິມບິນ',!!ST.billAddr,'set'],
  ['ມີສິນຄ້າທີ່ເປີດຂາຍ',PRD.some(function(p){return p.active}),'prd'],
  ['ລຶບສິນຄ້າຕົວຢ່າງ',!PRD.some(function(p){return SAMPLE.indexOf(p.name)>=0}),'prd'],
  ['ສິນຄ້າທຸກຢ່າງມີຮູບ',PRD.length>0&&PRD.every(function(p){return p.img}),'prd'],
  ['ໃສ່ຕົ້ນທຶນທຸກສິນຄ້າ (ໃຫ້ກຳໄລຖືກຕ້ອງ)',PRD.length>0&&PRD.every(function(p){return Number(p.cost)>0}),'prd'],
  ['ມີອໍເດີທົດລອງຜ່ານເວັບ ຢ່າງໜ້ອຍ 1 ຄັ້ງ',ORD.some(function(o){return o.source==='web'}),'ord'],
  ['ແລ່ນ update-2.sql ແລ້ວ (ຕາຕະລາງຕັ້ງຄ່າແອັດມິນ)',GSOK,'set'],
  ['ແລ່ນ update-4.sql ແລ້ວ (ຕົວເລືອກສິນຄ້າ, ຫຼາຍຮູບ, ແກ້ອໍເດີ, Telegram, ກັນສະແປມ)',U4OK,'set'],
  ['ຕັ້ງແຈ້ງເຕືອນ Telegram (ແນະນຳ ບໍ່ພາດອໍເດີເມື່ອປິດໜ້າແອັດມິນ)',!!(GS.tgToken&&GS.tgChat&&GS.tgOn),'set']]}
function goLiveHtml(){
  var gl=ls('golive',{}),a=goLiveItems(),m=GOLIVE_MANUAL;
  var done=a.filter(function(x){return x[1]}).length+m.filter(function(x){return gl[x[0]]}).length,total=a.length+m.length,all=done===total;
  var li=function(ok,txt,extra){return'<li style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)"><span aria-hidden="true" style="width:22px;text-align:center">'+(ok?'✅':'⬜')+'</span><span style="flex:1;'+(ok?'color:var(--muted)':'')+'">'+txt+'</span>'+(extra||'')+'</li>'};
  return'<details class="card" style="margin-bottom:12px"'+(all?'':' open')+'><summary style="cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+(all?'✅ ພ້ອມເປີດຂາຍແລ້ວ':'📋 ລາຍການກ່ອນເປີດຂາຍຈິງ')+' <span class="muted sm" style="font-weight:500">'+done+'/'+total+'</span></summary>'+
   '<div class="pbar" style="margin:8px 0"><i style="width:'+Math.round(done/total*100)+'%"></i></div>'+
   '<div class="sm muted" style="margin-top:6px"><b>ກວດໃຫ້ອັດຕະໂນມັດ</b></div><ul style="list-style:none;margin:0;padding:0">'+a.map(function(x){return li(x[1],esc(x[0]),x[1]?'':'<button class="btn sm" data-go="'+x[2]+'">ໄປແກ້</button>')}).join('')+'</ul>'+
   '<div class="sm muted" style="margin-top:12px"><b>ຕິກເອງ ເມື່ອເຮັດແລ້ວ</b></div><ul style="list-style:none;margin:0;padding:0">'+m.map(function(x){return'<li style="padding:2px 0;border-bottom:1px solid var(--line)"><label class="check" style="padding:6px 0"><input type="checkbox" data-gl="'+x[0]+'"'+(gl[x[0]]?' checked':'')+'> <span style="'+(gl[x[0]]?'color:var(--muted)':'')+'">'+esc(x[1])+'</span></label></li>'}).join('')+'</ul></details>'}
function goLiveBind(v){v.querySelectorAll('[data-gl]').forEach(function(cb){cb.onchange=function(){var g=ls('golive',{});g[cb.dataset.gl]=cb.checked;lsSet('golive',g);view()}})}

// ---------- events ----------
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-t],[data-go],[data-of],[data-pf],[data-o],[data-p],[data-c],[data-close],#addOrd,#addPrd,#addCp');if(!t)return;
  if(t.hasAttribute('data-close')){var o=t.closest('.ov');if(o)o.remove();return}
  if(t.dataset.go){A.tab=t.dataset.go;if(t.dataset.of)A.of=t.dataset.of;if(t.dataset.pf)A.pf=t.dataset.pf;badges();view();return}
  if(t.dataset.t){A.tab=t.dataset.t;badges();view();return}
  if(t.dataset.of&&t.classList.contains('chip')){A.of=t.dataset.of;view();return}
  if(t.dataset.pf&&t.classList.contains('chip')){A.pf=t.dataset.pf;view();return}
  if(t.dataset.o)orderModal(t.dataset.o);
  else if(t.dataset.p)prdModal(t.dataset.p);
  else if(t.dataset.c)cpModal(t.dataset.c);
  else if(t.id==='addOrd')manualModal();
  else if(t.id==='addPrd')prdModal();
  else if(t.id==='addCp')cpModal();
});
if(SB.session)start();else showLogin();
})();
